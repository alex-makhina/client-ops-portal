services:

  db_auth:
    image: postgres:${POSTGRES_VERSION:-18-alpine}
    container_name: client_ops_portal_auth_db
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    networks:
      - cop-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:${POSTGRES_VERSION:-18-alpine}
    container_name: client_ops_portal_db
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cop-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  directory-db:
    image: postgres:${POSTGRES_VERSION:-18-alpine}
    container_name: client_ops_portal_directory_db
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_directory_data:/var/lib/postgresql/data
    networks:
      - cop-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  crm-db:
    image: postgres:${POSTGRES_VERSION:-18-alpine}
    container_name: client_ops_portal_crm_db
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - postgres_crm_data:/var/lib/postgresql/data
    networks:
      - cop-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  reporting-db:
    image: postgres:${POSTGRES_VERSION:-18-alpine}
    container_name: client_ops_portal_reporting_db
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_reporting_data:/var/lib/postgresql/data
    networks:
      - cop-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:${ADMINER_VERSION:-5.4.2}
    container_name: client_ops_portal_adminer
    restart: unless-stopped
    ports:
      - 8080:8080
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - cop-network
    depends_on:
      db:
        condition: service_healthy

  crm:
    build:
      context: .
      dockerfile: src/services/crm/Dockerfile
    container_name: client_ops_portal_crm
    restart: unless-stopped
    ports:
      - "${CRM_PORT:-5080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__AppConnection: Host=crm-db;Port=5432;Database=ClientOpsPortalCrmDb;Username=${DB_USER:-postgres};Password=${DB_PASSWORD}
      ServicesDirectory__BaseUrl: http://services-directory:8080
      RabbitMq__Host: ${RABBITMQ_HOST:-rabbitmq}
      RabbitMq__Port: 5672
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      AuthService__BaseUrl: http://auth:8080
    networks:
      - cop-network
    depends_on:
      crm-db:
        condition: service_healthy
      services-directory:
        condition: service_started

  services-directory:
    build:
      context: .
      dockerfile: src/services/services-directory/Dockerfile
    container_name: client_ops_portal_services_dir
    restart: unless-stopped
    ports:
      - "${DIRECTORY_PORT:-5100}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DirectoryDb: Host=directory-db;Port=5432;Database=ClientOpsPortalDirectoryDb;Username=${DB_USER:-postgres};Password=${DB_PASSWORD}
      Redis__Configuration: ${REDIS_HOST:-redis}:${REDIS_PORT:-6379}
    networks:
      - cop-network
    depends_on:
      directory-db:
        condition: service_healthy
      redis:
        condition: service_started

  reporting:
    build:
      context: .
      dockerfile: src/services/reporting/Dockerfile
    container_name: client_ops_portal_reporting
    restart: unless-stopped
    ports:
      - "${REPORTING_PORT:-5130}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__ReportingDb: Host=reporting-db;Port=5432;Database=ClientOpsPortalReportsDb;Username=${DB_USER:-postgres};Password=${DB_PASSWORD}
    networks:
      - cop-network
    depends_on:
      reporting-db:
        condition: service_healthy

  redis:
    image: redis:${REDIS_VERSION:-7-alpine}
    container_name: client_ops_portal_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - cop-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth:
    build:
      context: .
      dockerfile: src/services/auth/Dockerfile
    container_name: client_ops_portal_auth
    restart: unless-stopped
    ports:
      - "${AUTH_PORT:-5110}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__AuthDb: Host=db_auth;Port=5432;Database=ClientOpsPortalAuthDb;Username=${DB_USER:-postgres};Password=${DB_PASSWORD}
      Jwt__Issuer: ClientOpsPortal
      Jwt__Audience: ClientOpsPortalClient
      Jwt__SecretKey: supersecretkeysupersecretkeysupersecretkeysupersecretkey
      Jwt__ExpiryMinutes: 60
      RabbitMq__Host: ${RABBITMQ_HOST:-rabbitmq}
      RabbitMq__Port: 5672
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
    networks:
      - cop-network
    depends_on:
      db_auth:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: src/services/api-gateway/Dockerfile
    container_name: client_ops_portal_gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-5000}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
    networks:
      - cop-network
    depends_on:
      - crm
      - auth
      - services-directory
      - reporting
      - notifications

  rabbitmq:
    image: rabbitmq:${RABBITMQ_VERSION:-3-management}
    container_name: client_ops_portal_rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - cop-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  notifications:
    build:
      context: .
      dockerfile: src/services/notifications/Dockerfile
    container_name: client_ops_portal_notifications
    restart: unless-stopped
    ports:
      - "${NOTIFICATIONS_PORT:-5120}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      RabbitMq__Host: ${RABBITMQ_HOST:-rabbitmq}
      RabbitMq__Port: 5672
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      EmailSettings__SmtpHost: ${SMTP_HOST:-}
      EmailSettings__SmtpPort: ${SMTP_PORT:-587}
      EmailSettings__FromEmail: ${SMTP_FROM:-no-reply@clientopsportal.com}
      EmailSettings__FromName: ClientOpsPortal
    networks:
      - cop-network
    depends_on:
      rabbitmq:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: src/apps/admin-portal/Dockerfile
    container_name: client_ops_portal_web
    restart: unless-stopped
    ports:
      - "${BLAZOR_PORT:-5022}:80"
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://localhost:5000}
    networks:
      - cop-network
    depends_on:
      - api-gateway

  personal-account:
    build:
      context: .
      dockerfile: src/apps/personal-account/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api/v1}
    container_name: client_ops_portal_pa
    restart: unless-stopped
    ports:
      - "${REACT_PORT:-62000}:80"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api/v1}
    networks:
      - cop-network
    depends_on:
      - api-gateway

volumes:
  postgres_data:
  postgres_auth_data:
  postgres_directory_data:
  postgres_crm_data:
  postgres_reporting_data:
  redis_data:
  rabbitmq_data:

networks:
  cop-network:
    driver: bridge