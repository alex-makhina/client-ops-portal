services:

  db_auth:
    image: postgres:${POSTGRES_VERSION:-17-alpine}
    container_name: client_ops_portal_auth_db
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_auth_data:/var/lib/postgresql
    networks:
      - cop-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10

  db:
    image: postgres:${POSTGRES_VERSION:-17-alpine}
    container_name: client_ops_portal_db
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - cop-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10

  directory-db:
    image: postgres:${POSTGRES_VERSION:-17-alpine}
    container_name: client_ops_portal_directory_db
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_directory_data:/var/lib/postgresql
    networks:
      - cop-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10

  crm-db:
    image: postgres:${POSTGRES_VERSION:-17-alpine}
    container_name: client_ops_portal_crm_db
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_crm_data:/var/lib/postgresql
    networks:
      - cop-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10

  reporting-db:
    image: postgres:${POSTGRES_VERSION:-17-alpine}
    container_name: client_ops_portal_reporting_db
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_reporting_data:/var/lib/postgresql
    networks:
      - cop-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:${ADMINER_VERSION:-5.4.2}
    container_name: client_ops_portal_adminer
    restart: unless-stopped
    ports:
      - 8080:8080
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - cop-network
    depends_on:
      db:
        condition: service_healthy

  crm:
    build:
      context: .
      dockerfile: src/services/crm/Dockerfile
    container_name: client_ops_portal_crm
    restart: unless-stopped
    ports:
      - "${CRM_PORT:-5080}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__AppConnection: Host=crm-db;Port=5432;Database=ClientOpsPortalCrmDb;Username=${DB_USER:-postgres};Password=${DB_PASSWORD}
      ServicesDirectory__BaseUrl: http://services-directory:8080
      Services__SubscriptionHistory__BaseUrl: http://subscription-history:8080
      RabbitMq__Host: ${RABBITMQ_HOST:-rabbitmq}
      RabbitMq__Port: 5672
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      AuthService__BaseUrl: http://auth:8080
      AuthService__PublicUrl: http://localhost:5110
      Jwt__JwksUrl: http://auth:8080/.well-known/jwks
      Jwt__Issuer: http://localhost:5110/
      Jwt__Audience: ClientOpsPortalClient
    networks:
      - cop-network
    depends_on:
      crm-db:
        condition: service_healthy
      services-directory:
        condition: service_started

  services-directory:
    build:
      context: .
      dockerfile: src/services/services-directory/Dockerfile
    container_name: client_ops_portal_services_dir
    restart: unless-stopped
    ports:
      - "${DIRECTORY_PORT:-5100}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__DirectoryDb: Host=directory-db;Port=5432;Database=ClientOpsPortalDirectoryDb;Username=${DB_USER:-postgres};Password=${DB_PASSWORD}
      Redis__Configuration: ${REDIS_HOST:-redis}:${REDIS_PORT:-6379}
      Jwt__JwksUrl: http://auth:8080/.well-known/jwks
      Jwt__Issuer: http://localhost:5110/
      Jwt__Audience: ClientOpsPortalClient
    networks:
      - cop-network
    depends_on:
      directory-db:
        condition: service_healthy
      redis:
        condition: service_started

  reporting:
    build:
      context: .
      dockerfile: src/services/reporting/Dockerfile
    container_name: client_ops_portal_reporting
    restart: unless-stopped
    ports:
      - "${REPORTING_PORT:-5130}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__ReportingDb: Host=reporting-db;Port=5432;Database=ClientOpsPortalReportsDb;Username=${DB_USER:-postgres};Password=${DB_PASSWORD}
      RabbitMq__Host: ${RABBITMQ_HOST:-rabbitmq}
      RabbitMq__Port: 5672
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      Jwt__JwksUrl: http://auth:8080/.well-known/jwks
      Jwt__Issuer: http://localhost:5110/
      Jwt__Audience: ClientOpsPortalClient
    networks:
      - cop-network
    depends_on:
      reporting-db:
        condition: service_healthy

  redis:
    image: redis:${REDIS_VERSION:-7-alpine}
    container_name: client_ops_portal_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - cop-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth:
    build:
      context: .
      dockerfile: src/services/auth/Dockerfile
    container_name: client_ops_portal_auth
    restart: unless-stopped
    ports:
      - "${AUTH_PORT:-5110}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__AuthDb: Host=db_auth;Port=5432;Database=ClientOpsPortalAuthDb;Username=${DB_USER:-postgres};Password=${DB_PASSWORD}
      Jwt__KeyPath: /app/keys/jwt-signing.pem
      RabbitMq__Host: ${RABBITMQ_HOST:-rabbitmq}
      RabbitMq__Port: 5672
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - auth-keys:/app/keys
    networks:
      - cop-network
    depends_on:
      db_auth:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: src/services/api-gateway/Dockerfile
    container_name: client_ops_portal_gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-5000}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      Jwt__JwksUrl: http://auth:8080/.well-known/jwks
      Jwt__Issuer: http://localhost:5110/
      Jwt__Audience: ClientOpsPortalClient
    networks:
      - cop-network
    depends_on:
      - crm
      - auth
      - services-directory
      - reporting
      - notifications

  rabbitmq:
    image: rabbitmq:${RABBITMQ_VERSION:-3-management}
    container_name: client_ops_portal_rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - cop-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  notifications:
    build:
      context: .
      dockerfile: src/services/notifications/Dockerfile
    container_name: client_ops_portal_notifications
    restart: unless-stopped
    ports:
      - "${NOTIFICATIONS_PORT:-5120}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      RabbitMq__Host: ${RABBITMQ_HOST:-rabbitmq}
      RabbitMq__Port: 5672
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      EmailSettings__SmtpHost: ${SMTP_HOST:-}
      EmailSettings__SmtpPort: ${SMTP_PORT:-587}
      EmailSettings__FromEmail: ${SMTP_FROM:-no-reply@clientopsportal.com}
      EmailSettings__FromName: ClientOpsPortal
      Jwt__JwksUrl: http://auth:8080/.well-known/jwks
      Jwt__Issuer: http://localhost:5110/
      Jwt__Audience: ClientOpsPortalClient
    networks:
      - cop-network
    depends_on:
      rabbitmq:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: src/apps/admin-portal/Dockerfile
    container_name: client_ops_portal_web
    restart: unless-stopped
    ports:
      - "${BLAZOR_PORT:-5022}:80"
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://localhost:5000}
    networks:
      - cop-network
    depends_on:
      - api-gateway

  personal-account:
    build:
      context: .
      dockerfile: src/apps/personal-account/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api/v1}
    container_name: client_ops_portal_pa
    restart: unless-stopped
    ports:
      - "${REACT_PORT:-62000}:80"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api/v1}
    networks:
      - cop-network
    depends_on:
      - api-gateway
      
  mongodb:
    image: mongo:${MONGODB_VERSION:-7.0}
    container_name: client_ops_portal_mongodb
    restart: unless-stopped
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-password}
      MONGO_INITDB_DATABASE: SubscriptionHistoryDb
    volumes:
      - mongodb_data:/data/db
    networks:
      - cop-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      
  subscription-history:
    build:
      context: .
      dockerfile: src/services/subscription-history/Dockerfile
    container_name: client_ops_portal_subscription_history
    restart: unless-stopped
    ports:
      - "${SUBSCRIPTION_HISTORY_PORT:-5200}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      MongoDb__ConnectionString: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-password}@mongodb:27017
      MongoDb__DatabaseName: SubscriptionHistoryDb
      MongoDb__SubscriptionHistoryCollection: SubscriptionHistories
      MongoDb__SubscriptionHistoryStepCollection: SubscriptionHistorySteps
      Jwt__JwksUrl: http://auth:8080/.well-known/jwks
      Jwt__Issuer: http://localhost:5110/
      Jwt__Audience: ClientOpsPortalClient
    networks:
      - cop-network
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  postgres_data:
  postgres_auth_data:
  postgres_directory_data:
  postgres_crm_data:
  postgres_reporting_data:
  redis_data:
  rabbitmq_data:
  auth-keys:
  mongodb_data:

networks:
  cop-network:
    driver: bridge