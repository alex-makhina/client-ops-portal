server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Blazor WASM: proper MIME types for .wasm, .dll, .dat files
    location ~* \.wasm$ {
        add_header Content-Type application/wasm;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.dll$ {
        add_header Content-Type application/octet-stream;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.dat$ {
        add_header Content-Type application/octet-stream;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Block Brotli pre-compressed files вЂ” no brotli module in default nginx:alpine.
    # Blazor loader falls back to uncompressed (.wasm, .dll) on 404.
    location ~* \.br$ {
        return 404;
    }

    location /_framework/ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location /_content/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback - all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # Do not cache appsettings.json so API URL can be changed at runtime
    location = /appsettings.json {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}

